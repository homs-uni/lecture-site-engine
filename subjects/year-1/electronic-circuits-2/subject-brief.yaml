schema_version: "2.0"

# ─── Subject identity ─────────────────────────────────────────────────────────
subject:
  id: electronic-circuits-2
  name_ar: "الدارات الإلكترونية 2"
  name_en: "Electronic Circuits 2"
  tagline: "BJT MOSFET Solar Power Batteries"
  section_label: "القسم النظري"

# ─── Locale & terminology ─────────────────────────────────────────────────────
locale:
  language: ar
  direction: rtl
  terms_in_backticks: true
  inline_code_comments: none
  extra_explanation_tag: "(شرح زيادة للفهم)"
  not_in_lecture_tag: "(غير مشروحة في المحاضرة)"

# ─── Domain & Content Organization ─────────────────────────────────────────────
domain: mixed

domain_profile:
  content_types:
    - theory
    - diagrams
    - tables
    - equations
    - pseudocode
  forbid_adding: ["Java", "Python", "C++"]
  prerequisites: ["أساسيات التيار المستمر", "قانون أوم وقوانين كيرشوف", "مبادئ الديودات"]

# ─── Content Ordering Rules ────────────────────────────────────────────────────
content_ordering:
  section_type_rules:
    equation_subjects: [electronic-circuits-2]
    code_subjects: []
    diagram_subjects: []

  default_type: "equation-first"

# ─── Visualization Templates Available ─────────────────────────────────────────
visualization_templates:
  enabled_types:
    - inline-text
    - inline-algorithm
    - full-width-algorithm
    - comparison-table
    - cycle
    - sequence
    - tree
    - flowchart

  diagram_types: [flowchart, circuit-schematic, decision-tree]

# ─── Coverage Tracking ──────────────────────────────────────────────────────────
coverage_tracking:
  enabled: true
  require_metadata: true
  acceptable_coverage_threshold: 90

# ─── Original Text Display ──────────────────────────────────────────────────────
original_text_display:
  enabled: true
  format: "collapsible"
  show_coverage_badge: true
  location: "after-explanation"

# ─── Lecture heading ────────────────────────────────────────────────────────────
lecture:
  unit_label: "المحاضرة"
  split_regex: "^# المحاضرة "
  title_pattern: "# {unit_label} {num} — {title_en} ({title_ar})"
  intro_blockquote: true
  combine_related_topics: false

# ─── Parts ──────────────────────────────────────────────────────────────────────
parts:
  integration_map:
    enabled: false
    heading: "📌 خريطة التكامل (أين تقع هذه المحاضرة في الدورة؟)"

  summary:
    enabled: true
    heading: "الجزء الأول: ملخص منظم (اقرأ قبل المحاضرة!)"
    subsections:
      - lecture_overview
      - learning_objectives
      - prerequisites
      - main_concepts
      - connections
      - common_mistakes

  detail:
    enabled: true
    heading: "الجزء الثاني: الشرح التفصيلي (سطر بسطر / فقرة بفقرة)"
    numbered_sections: true
    require_per_section: []

  mcq:
    enabled: true
    heading: "الجزء الثالث: أسئلة اختيار من متعدد (MCQ)"
    count: 16
    min_count: 14
    difficulty: [medium, hard]
    forbid_easy_literal: false
    distribution:
      comparisons: 25
      code_scenario: 35
      application: 30
      algorithm_trace: 10

  debug:
    enabled: false
    heading: "الجزء الرابع: أسئلة تصحيح الكود"
    count: 5
    cover: [logic, misconception, return_check, dead_code]

  exercise:
    enabled: false
    heading: "الجزء الرابع: تمارين إضافية (من إعداد الدليل للتدريب)"
    count_min: 4
    count_max: 7
    authored_by_guide: true
    types:
      - fill_gaps
      - code_fix
      - scenario

  analysis_exercise:
    enabled: false
    heading: "الجزء الرابع: تمارين تحليل وتطبيق (إضافية — من إعداد الدليل)"
    count_min: 3
    count_max: 6
    types:
      - case_study
      - diagram_completion
      - table_fill
      - written_analysis

  trace_exercise:
    enabled: false
    heading: "الجزء الرابع: تمارين تتبع التنفيذ"
    count_min: 3
    note: "كل تمرين: مدخل + جدول/شجرة ناقصة للطالب + نموذج الحل الكامل"

  design_question:
    enabled: false
    heading: "الجزء الرابع: أسئلة تصميم"
    count_min: 1
    types:
      - er_diagram
      - uml_design
      - architecture
      - schema_design

  theory:
    enabled: false
    heading: "الجزء الخامس: أسئلة نظرية متوقعة بالامتحان"
    count_min: 8

  cheat_sheet:
    enabled: true
    heading: "الجزء الرابع: ورقة المراجعة السريعة (Cheat Sheet)"
    subsections:
      - integration_map_table
      - golden_rules_table
      - quick_reference_tables

  qa_cards:
    enabled: true
    heading: "الجزء الثالث: بطاقات سؤال وجواب (Q&A Cards)"
    count_min: 12

  reference_code:
    enabled: false
    heading: "الجزء الخامس: كتابة الكود الكامل (مرجع شامل)"
    assemble_from_fragments: true
    same_program_only: true
    languages: []
    note: ""

  checklist:
    enabled: false
    heading: "الجزء السادس: قائمة فحص ذاتي قبل الامتحان ✅"

# ─── Blocks ─────────────────────────────────────────────────────────────────────
blocks:

  original_quote:
    enabled: false

  render_metadata:
    enabled: true

  simplified_explanation:
    enabled: true

  code:
    enabled: false
    languages: []
    require_line_explain: true

  line_explain:
    enabled: false
    format: numbered_list

  imports:
    enabled: false

  expected_output:
    enabled: false

  troubleshooting:
    enabled: false

  diagrams:
    enabled: true
    types: [flowchart, circuit-schematic]
    require_node_table: true
    require_edge_table: true

  uml:
    enabled: false
    types: [usecase, class, activity, flowchart]

  screen_description:
    enabled: false

  algorithm:
    enabled: true

  structured_english:
    enabled: false

  compare:
    enabled: true

  callouts:
    enabled: true

  think_prompt:
    enabled: true
    min_per_lecture: 3

  tables:
    enabled: true

  fill_gaps:
    enabled: true

  code_fix:
    enabled: false

  images_note:
    enabled: false

  qa_inline:
    enabled: false

  analogy:
    enabled: true

  trade_off:
    enabled: true

  before_after:
    enabled: true

  trace:
    enabled: true

  equations:
    enabled: true
    display_mode: block
    require_explanation: true
    common_symbols: ["V_BE", "V_CE", "V_GS", "V_DS", "I_C", "I_D", "β", "α", "g_m", "r_π"]

# ─── Section Structure Template ────────────────────────────────────────────────
section_template:
  structure:
    - element: "heading"
      label: "### 1.1 Topic Name"
      required: true

    - element: "render_metadata"
      format: "<!-- @render: {type: \"...\", visualization: \"...\", coverage: \"...\", connectivity: {...}} -->"
      required: true

    - element: "context"
      label: "📍 أين نحن الآن؟"
      format: "#### [one sentence]"
      required: false

    - element: "connectivity"
      label: "⬅️ الربط مع السابق"
      format: "#### [one sentence — prerequisite or connection to previous topic]"
      required: true
      note: "يحل محل 'النص الأصلي يقول' في النموذج"

    - element: "core_idea"
      label: "💡 الفكرة الأساسية"
      format: "#### **[One sentence core idea — bold, high contrast]**"
      required: true

    - element: "definition_or_formula"
      label: "[📐 التعريف / الصيغة] أو [💻 الكود] أو [📊 المخطط]"
      format: "#### [Depends on content_type]"
      required: false
      conditional: "if type: equation-first then required"

    - element: "explanation"
      label: "📖 الشرح"
      format: "#### [2-4 short paragraphs, NOT one dense block]"
      required: true

    - element: "summary"
      label: "🎯 الملخص السريع"
      format: "#### [Bullets — 3-5 key points]"
      required: false

    - element: "application"
      label: "📚 التطبيق / استخدام"
      format: "#### [Where is this used next? How does it connect forward?]"
      required: false

    - element: "original_text_collapsible"
      label: "📄 النص الأصلي من المحاضرة"
      format: |
        <details>
        <summary>عرض النص الأصلي (coverage: XX%)</summary>
        > [EXACT QUOTE]
        </details>
      required: true
      note: "Collapsible by default — not visible unless clicked"

    - element: "common_mistakes"
      label: "⚠️ أخطاء شائعة"
      format: "#### [List with ❌ and ✓]"
      required: false

# ─── Pedagogy flags ──────────────────────────────────────────────────────────
pedagogy:
  cover_every_line: true
  complete_gaps: true
  beginner_friendly: true
  explain_why: true
  daily_analogy_plus_example: true
  follow_lecture_order: true
  adapt_to_lecture_type: false

  lecture_types: []

# ─── Assessment ───────────────────────────────────────────────────────────────
assessment:
  mcq_option_letters: arabic

# ─── Automation Question Types ────────────────────────────────────────────────
automation_question_types:
  flash_qa:
    enabled: false

  scenario_cluster:
    enabled: false

  hands_on:
    enabled: false

  step_trace:
    enabled: false

  compare_analyze:
    enabled: false

  find_the_bug:
    enabled: false

  structured_theory:
    enabled: false

# ─── Output ───────────────────────────────────────────────────────────────────
output:
  validation_footer: true
  schema_reference: "SCHEMA.md v2.0"
  closing_line: "ابدأ الآن. سأرسل المحاضرة في الرسالة التالية."

  checklist_items:
    - "غطّيت كل معلومة وردت في المحاضرة"
    - "الملخص (Part 1): يشرح ماذا ستتعلم + لماذا مهم + المتطلبات السابقة"
    - "الملخص بدون جداول مقارنات (تلك في Cheat Sheet)"
    - "كل قسم detail يبدأ بـ '⬅️ الربط مع السابق' + '💡 الفكرة الأساسية' + الشرح"
    - "الأقسام مرقّمة هرمياً (1، 1.1، 2 …)"
    - "كل مصطلح إنجليزي بين backticks"
    - "النص الأصلي موجود في <details> collapsible مع @coverage metadata"
    - "≥16 سؤال MCQ مع تعليل كامل"
    - "≥12 بطاقة Q&A مع إجابات مختصرة"
    - "Cheat Sheet: جداول + مقارنات + قواميس + خطوات سريعة"
